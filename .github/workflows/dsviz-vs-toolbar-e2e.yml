# סרגל הכלים של DSViz ב-Visual Studio האמיתי, עם ההתקנה הציבורית (DSViz-Setup.exe): לוחצים על הכפתורים בסרגל
# ('שליחת תרגיל' -> שרת מדומה, והפרויקט נוסף לפתרון הפתוח בלי Reload ובלי Visual Studio שני; 'הרצה ויזואלית' -> חלון DSViz;
# 'מאגר תרגילים' -> מסך כניסה / חלון המאגר / 'צור תרגיל') ומצלמים כל שלב. התוצאות — ב-Artifacts.
# הרצה: דחיפה (push) לענף release/public-all עם שינוי באחד הקבצים שלמטה.
name: DSViz visual studio toolbar e2e
on:
  push:
    branches: [ccr-66784144-dygsmb, release/public-all]
    paths:
      - '.github/workflows/dsviz-vs-toolbar-e2e.yml'
      - 'java-visualizer/tools/test/windows-vs-toolbar/**'
      - 'java-visualizer/release/DSViz-Setup.exe'
      - 'java-visualizer/csharp/**'
      - 'java-visualizer/vs-bank/**'
      - 'java-visualizer/eclipse-plugin/src/il/lamerhav/dsviz/Account.java'
      - 'java-visualizer/eclipse-plugin/src/il/lamerhav/dsviz/AccessGate.java'
      - 'java-visualizer/eclipse-plugin/src/il/lamerhav/dsviz/OsTrust.java'
      - 'java-visualizer/eclipse-plugin/src/il/lamerhav/dsviz/WorkerClient.java'
      - 'java-visualizer/src/unit4/collectionsLib/TraceViewer.java'
      - 'java-visualizer/tools/build-jre.sh'
  workflow_dispatch:
concurrency:
  group: dsviz-vs-toolbar-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # המאגר מהמקור (dsviz-bank-vs.jar — הכניסה, עמדת הניהול): ההתקנה של המעבדה (lab-release/) לא נבנית מחדש כאן
  bank-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: dsviz.jar ו-dsviz-bank-vs.jar מהמקור
        working-directory: java-visualizer
        run: |
          sh tools/build-lib.sh   # הספרייה מהמקור (ה-jar שב-release/ של הענף ישן)
          SKIP_BANK_CHECK=1 sh tools/build-bank-vs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bank-vs-jar
          path: java-visualizer/build/lab-vs/dsviz-bank-vs.jar
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: dsviz-lib
          path: java-visualizer/release/dsviz.jar
          retention-days: 7
  # סינון אינטרנט שבודק תעבורה מוצפנת: תעודת שורש במאגר של Windows, שרת HTTPS מקומי, ה-Java של ההתקנה (jlink) עם / בלי OsTrust
  os-trust:
    needs: bank-jar
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@v4
        with: { name: dsviz-lib, path: dsviz-lib }
      - name: תעודת "סינון" במאגר של Windows ← החיבור של DSViz
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\java-visualizer\tools\test\windows-vs-toolbar\os-trust.ps1" -Root "$env:GITHUB_WORKSPACE\java-visualizer" -Lib "$env:GITHUB_WORKSPACE\dsviz-lib\dsviz.jar" -Out "$env:GITHUB_WORKSPACE\os-trust"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: os-trust, path: os-trust, retention-days: 14 }
  # שם משתמש / פרויקט בעברית (Windows באנגלית): הרצה ויזואלית, מאגר השאלות ועמדת הניהול מתיקיות בעברית — dsviz-cs.exe מהמקור
  hebrew-paths:
    needs: bank-jar
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/download-artifact@v4
        with: { name: dsviz-lib, path: dsviz-lib }
      - uses: actions/download-artifact@v4
        with: { name: bank-vs-jar, path: bank-vs-jar }
      - name: dsviz-cs.exe מהמקור
        shell: powershell
        run: |
          dotnet publish "$env:GITHUB_WORKSPACE\java-visualizer\csharp\DsViz.Runner\DsViz.Runner.csproj" -c Release -o "$env:RUNNER_TEMP\runner"
          exit $LASTEXITCODE
      - name: נתיבים בעברית
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\java-visualizer\tools\test\windows-vs-toolbar\hebrew-paths.ps1" -Root "$env:GITHUB_WORKSPACE\java-visualizer" -Lib "$env:GITHUB_WORKSPACE\dsviz-lib\dsviz.jar" -BankJar "$env:GITHUB_WORKSPACE\bank-vs-jar\dsviz-bank-vs.jar" -Runner "$env:RUNNER_TEMP\runner" -Out "$env:GITHUB_WORKSPACE\hebrew-paths"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: hebrew-paths, path: hebrew-paths, retention-days: 14 }
  toolbar:
    needs: bank-jar
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Visual Studio שיש במחשב
        shell: powershell
        run: |
          $vw = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          & $vw -all -prerelease -products * -format text -property displayName,catalog_productDisplayVersion,installationPath
      - uses: actions/download-artifact@v4
        with:
          name: bank-vs-jar
          path: bank-vs-jar
      - name: סרגל הכלים (התקנה, Visual Studio, לחיצות)
        timeout-minutes: 90
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\java-visualizer\tools\test\windows-vs-toolbar\toolbar-e2e.ps1" `
            -Lab "$env:GITHUB_WORKSPACE\java-visualizer\release\DSViz-Setup.exe" `
            -Out "$env:GITHUB_WORKSPACE\toolbar-ci" `
            -Here "$env:GITHUB_WORKSPACE\java-visualizer\tools\test\windows-vs-toolbar" `
            -Harness "$env:GITHUB_WORKSPACE\java-visualizer\tutorials\harness" `
            -Page "$env:GITHUB_WORKSPACE\java-visualizer\tools\test\ai\files\exam-page-1.png" `
            -Mock "$env:GITHUB_WORKSPACE\java-visualizer\tools\test\submit\mock-worker.js" `
            -Exercise "$env:GITHUB_WORKSPACE\java-visualizer\tools\test\submit\cs-stack.json" `
            -BankJar "$env:GITHUB_WORKSPACE\bank-vs-jar\dsviz-bank-vs.jar" `
            -Vsix "$env:GITHUB_WORKSPACE\java-visualizer\csharp\vs-extension\prebuilt\DsViz.VsExtension.vsix"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolbar-${{ matrix.os }}
          path: toolbar-ci
          retention-days: 14
