# "מאגר תרגילים" — גרסת בדיקה (רק למורה, לא לתלמידים), אחרי שכל שאלה במאגר נבדקת (Java וגם C#):
#   Eclipse: ההרחבה il.lamerhav.dsviz.bank_1.0.0.jar (Artifact: dsviz-exercise-bank-eclipse) — מעתיקים ל-dropins
#   Visual Studio: dsviz-bank-vs.jar + install.cmd (Artifact: dsviz-exercise-bank-vs) — ונבדק על Windows עם Visual Studio אמיתי:
#     התקנה, החלונות, יצירת תרגיל, Reload ב-Visual Studio, בנייה, פלט, הרצה ויזואלית, "סיימתי" (צילומי מסך: Artifact vs-bank-test)
#   IntelliJ: dsviz-bank-intellij-1.0.0.zip (Artifact: dsviz-exercise-bank-intellij) — אחרי הבדיקה הרחבה (27 שאלות, הגשר, סיימתי)
#     והבדיקות של התוסף בתוך IntelliJ
# לא נוגע ב-release/ ולא בקישור הקבוע — התלמידים לא מקבלים את זה.
name: DSViz lab (exercise bank)
on:
  push:
    branches: [ccr-66784144-dygsmb]
    paths:
      - '.github/workflows/dsviz-lab.yml'
      - 'java-visualizer/eclipse-bank/**'
      - 'java-visualizer/bank/**'
      - 'java-visualizer/tools/build-bank.sh'
      - 'java-visualizer/tools/test/bank/**'
      - 'java-visualizer/tools/test/bank-check.sh'
      - 'java-visualizer/vs-bank/**'
      - 'java-visualizer/tools/build-bank-vs.sh'
      - 'java-visualizer/tools/test/windows-vs/bank-vs.ps1'
      - 'java-visualizer/tools/test/windows-vs/BankVsIt.java'
      - 'java-visualizer/tools/test/windows-vs/BankVsAll.java'
      - 'java-visualizer/intellij-bank/**'
      - 'java-visualizer/tools/test/intellij-bank/**'
      - 'java-visualizer/tools/build-bank-ij.sh'
  workflow_dispatch:

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: בדיקת השאלות ובניית ההרחבה
        working-directory: java-visualizer
        run: sh tools/build-bank.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dsviz-exercise-bank-eclipse
          path: java-visualizer/build/lab/
          retention-days: 30

  vs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: בדיקת השאלות (גם C#) ובניית התוספת ל-Visual Studio
        working-directory: java-visualizer
        run: |
          sh tools/build-bank-vs.sh
          mkdir -p build/bank-vs-test
          javac -encoding UTF-8 -nowarn -cp release/dsviz.jar:build/lab-vs/dsviz-bank-vs.jar -d build/bank-vs-test tools/test/windows-vs/BankVsIt.java tools/test/windows-vs/BankVsAll.java
      - uses: actions/upload-artifact@v4
        with:
          name: dsviz-exercise-bank-vs
          path: java-visualizer/build/lab-vs/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: bank-vs-test-classes
          path: java-visualizer/build/bank-vs-test/
          retention-days: 3

  vs-test:
    needs: vs-build
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dsviz-exercise-bank-vs, path: lab-vs }
      - uses: actions/download-artifact@v4
        with: { name: bank-vs-test-classes, path: bank-vs-test }
      - name: מאגר תרגילים ב-Visual Studio אמיתי
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\java-visualizer\tools\test\windows-vs\bank-vs.ps1" `
            -Setup "$env:GITHUB_WORKSPACE\java-visualizer\release\DSViz-Setup.exe" `
            -Lab "$env:GITHUB_WORKSPACE\lab-vs" `
            -Out "$env:GITHUB_WORKSPACE\vs-bank-test" `
            -Bank "$env:GITHUB_WORKSPACE\java-visualizer\bank" `
            -TestCp "$env:GITHUB_WORKSPACE\bank-vs-test"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vs-bank-test
          path: vs-bank-test
          retention-days: 14

  ij-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: מאגר תרגילים ל-IntelliJ — בדיקות ובנייה
        working-directory: java-visualizer
        run: sh tools/build-bank-ij.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dsviz-exercise-bank-intellij
          path: java-visualizer/build/lab-ij/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ij-bank-test
          path: |
            java-visualizer/build/bank-ij-all/work/bank-ij-result.txt
            java-visualizer/build/bank-ij-all/work/*.png
            java-visualizer/intellij-bank/build/reports/tests/
          retention-days: 14
