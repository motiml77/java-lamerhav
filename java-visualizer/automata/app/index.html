<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>מודלים חישוביים · DSViz</title>
  <meta name="description" content="עורך וסימולטור אוטומטים בעברית: אס&quot;ד, אסל&quot;ד, אוטומט מחסנית ומכונת טיורינג. בונים מצבים ומעברים ומריצים מילה צעד אחרי צעד.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F6FED'/%3E%3Ccircle cx='11' cy='16' r='5' fill='none' stroke='white' stroke-width='2.2'/%3E%3Ccircle cx='23' cy='16' r='3.4' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='23' cy='16' r='5.6' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
  <script>
    /* ערכת נושא לפני הציור הראשון, כדי שלא יהבהב לבן במצב כהה */
    (function () {
      var t = null;
      try { t = localStorage.getItem('dsviz.automata.theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#word-input">דילוג לחלון ההרצה</a>
  <div class="app" id="app" data-type="dfa">

    <!-- סרגל עליון: מותג, שם המכונה, סוג המכונה, פעולות -->
    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><circle cx="11" cy="16" r="5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="23" cy="16" r="3.4" fill="none" stroke="#fff" stroke-width="2"/><circle cx="23" cy="16" r="5.6" fill="none" stroke="#fff" stroke-width="1.6"/></svg>
        <div class="brand-text"><b>מודלים חישוביים</b><span>DSViz</span></div>
      </div>
      <label class="machine-name" title="שם המכונה">
        <span class="sr">שם המכונה</span>
        <input id="machine-name" type="text" maxlength="60" spellcheck="false" autocomplete="off">
      </label>

      <nav class="type-tabs" role="tablist" aria-label="סוג המכונה" id="type-tabs">
        <button role="tab" type="button" data-type="dfa" title="אוטומט סופי דטרמיניסטי (Alt+1)"><span class="tt-he">אס"ד</span><span class="tt-en">DFA</span></button>
        <button role="tab" type="button" data-type="nfa" title="אוטומט סופי לא דטרמיניסטי, כולל מעברי ε (Alt+2)"><span class="tt-he">אסל"ד</span><span class="tt-en">NFA</span></button>
        <button role="tab" type="button" data-type="pda" title="אוטומט מחסנית (Alt+3)"><span class="tt-he">אוטומט מחסנית</span><span class="tt-en">PDA</span></button>
        <button role="tab" type="button" data-type="tm" title="מכונת טיורינג (Alt+4)"><span class="tt-he">מכונת טיורינג</span><span class="tt-en">TM</span></button>
      </nav>

      <div class="top-actions">
        <button type="button" class="btn icon ghost" data-cmd="undo" title="ביטול (Ctrl+Z)" aria-label="ביטול"></button>
        <button type="button" class="btn icon ghost" data-cmd="redo" title="חזרה (Ctrl+Shift+Z)" aria-label="חזרה"></button>
        <span class="vsep"></span>
        <div class="menu-wrap">
          <button type="button" class="btn ghost" data-cmd="examples" aria-haspopup="menu" aria-expanded="false"><i data-icon="book"></i><span>דוגמאות</span><i data-icon="chevronDown" class="chev"></i></button>
          <div class="menu" id="examples-menu" role="menu" hidden></div>
        </div>
        <button type="button" class="btn ghost" data-cmd="new" title="מכונה חדשה וריקה בלשונית הזו"><i data-icon="plus"></i><span>חדש</span></button>
        <button type="button" class="btn ghost" data-cmd="open" title="פתיחת קובץ JSON (Ctrl+O)"><i data-icon="open"></i><span>פתיחה</span></button>
        <div class="menu-wrap">
          <button type="button" class="btn ghost" data-cmd="save-menu" aria-haspopup="menu" aria-expanded="false" title="שמירה (Ctrl+S)"><i data-icon="save"></i><span>שמירה</span><i data-icon="chevronDown" class="chev"></i></button>
          <div class="menu" id="save-menu" role="menu" hidden>
            <button type="button" role="menuitem" data-cmd="save"><i data-icon="save"></i><span class="mi-text"><b>שמירה כקובץ</b><small>JSON, אפשר לפתוח שוב בכל מחשב</small></span><kbd>Ctrl+S</kbd></button>
            <button type="button" role="menuitem" data-cmd="export-svg"><i data-icon="layout"></i><span class="mi-text"><b>ייצוא תמונה</b><small>SVG של הדיאגרמה, לדף עבודה או למצגת</small></span></button>
          </div>
        </div>
        <span class="vsep"></span>
        <button type="button" class="btn icon ghost" data-cmd="theme" title="מצב כהה / בהיר" aria-label="מצב כהה או בהיר"></button>
        <button type="button" class="btn icon ghost" data-cmd="help" title="קיצורי מקלדת (?)" aria-label="עזרה וקיצורי מקלדת"></button>
      </div>
    </header>

    <!-- סרגל כלים אנכי (בצד ימין, כי הממשק RTL) -->
    <aside class="rail" role="toolbar" aria-orientation="vertical" aria-label="כלים">
      <button type="button" class="tool" data-tool="select" title="בחירה והזזה (V)" aria-label="בחירה"><i data-icon="select"></i></button>
      <button type="button" class="tool" data-tool="state" title="מצב חדש: לחיצה על הקנבס (S)" aria-label="מצב חדש"><i data-icon="state"></i></button>
      <button type="button" class="tool" data-tool="transition" title="מעבר: לחיצה על מצב המקור ואז על היעד (T)" aria-label="מעבר"><i data-icon="transition"></i></button>
      <button type="button" class="tool" data-tool="hand" title="הזזת התצוגה (H, או רווח + גרירה)" aria-label="הזזת התצוגה"><i data-icon="hand"></i></button>
      <span class="hsep"></span>
      <button type="button" class="tool" data-cmd="layout" title="סידור אוטומטי (L)" aria-label="סידור אוטומטי"><i data-icon="layout"></i></button>
      <button type="button" class="tool" data-cmd="fit" title="התאמה למסך (F)" aria-label="התאמה למסך"><i data-icon="fit"></i></button>
      <span class="rail-spacer"></span>
      <button type="button" class="tool danger" data-cmd="delete" title="מחיקת הבחירה (Delete)" aria-label="מחיקה"><i data-icon="trash"></i></button>
    </aside>

    <!-- הקנבס -->
    <main class="stage" id="stage">
      <svg class="canvas" role="application" aria-label="הדיאגרמה של המכונה" aria-roledescription="קנבס">
        <defs>
          <pattern id="grid-minor" width="20" height="20" patternUnits="userSpaceOnUse"><path class="grid-line" d="M20 0H0V20"/></pattern>
          <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse"><path class="grid-line-major" d="M100 0H0V100"/></pattern>
        </defs>
        <rect class="grid-bg" width="100%" height="100%" fill="url(#grid-minor)"/>
        <rect class="grid-bg" width="100%" height="100%" fill="url(#grid-major)"/>
        <g class="viewport" dir="ltr">
          <g class="edges"></g>
          <g class="states"></g>
          <g class="labels"></g>
          <g class="overlay"></g>
        </g>
      </svg>

      <div class="canvas-status" id="canvas-status" role="button" tabindex="0"></div>
      <div class="state-toolbar" role="toolbar" aria-label="פעולות על המצב" hidden></div>
      <div class="inline-editor" hidden></div>
      <div class="hint" id="hint" role="status" aria-live="polite" hidden></div>

      <div class="empty" id="empty">
        <svg width="120" height="64" viewBox="0 0 120 64" aria-hidden="true" class="empty-art"><path d="M8 32h14" class="ea-line"/><path d="M18 28l4 4-4 4" class="ea-line"/><circle cx="40" cy="32" r="16" class="ea-st"/><path d="M57 27c8-7 18-7 26 0" class="ea-line dash"/><path d="M80 23l3 4-4.5 1.5" class="ea-line"/><circle cx="100" cy="32" r="16" class="ea-st dash"/><circle cx="100" cy="32" r="12" class="ea-st dash"/></svg>
        <h2>מתחילים ממצב ראשון</h2>
        <p>לחיצה כפולה על הקנבס מוסיפה מצב. גוררים מהשפה של מצב אל מצב אחר כדי ליצור מעבר.</p>
        <div class="empty-actions">
          <button type="button" class="btn primary" data-cmd="add-state"><i data-icon="state"></i><span>מצב חדש</span></button>
          <button type="button" class="btn secondary" data-cmd="load-example"><i data-icon="book"></i><span>טעינת דוגמה</span></button>
        </div>
      </div>

      <div class="zoom" aria-label="זום">
        <button type="button" class="btn icon ghost sm" data-cmd="zoom-out" title="הקטנה (-)" aria-label="הקטנה"><i data-icon="zoomOut"></i></button>
        <button type="button" class="zoom-val" data-cmd="zoom-reset" title="100% (0)" id="zoom-val">100%</button>
        <button type="button" class="btn icon ghost sm" data-cmd="zoom-in" title="הגדלה (+)" aria-label="הגדלה"><i data-icon="zoomIn"></i></button>
      </div>
      <div class="toasts" id="toasts" aria-live="polite"></div>
    </main>

    <!-- פאנל צד: מאפיינים / אלפבית / בעיות -->
    <aside class="side" aria-label="מאפיינים">
      <div class="side-tabs" role="tablist">
        <button role="tab" type="button" data-tab="props" aria-selected="true"><i data-icon="sliders"></i>מאפיינים</button>
        <button role="tab" type="button" data-tab="alpha" aria-selected="false"><i data-icon="sigma"></i>אלפבית</button>
        <button role="tab" type="button" data-tab="issues" aria-selected="false"><i data-icon="warn"></i>בעיות<span class="badge" id="issues-badge" hidden></span></button>
      </div>
      <div class="side-body" id="side-body"></div>
    </aside>

    <!-- חלון ההרצה -->
    <section class="runpanel" aria-label="הרצה">
      <div class="run-main">
        <div class="run-bar">
          <label class="word">
            <span class="word-label">מילה</span>
            <input id="word-input" type="text" dir="ltr" spellcheck="false" autocomplete="off" placeholder="ε  (מילה ריקה)" aria-describedby="run-note">
          </label>
          <div class="controls" dir="ltr" role="group" aria-label="בקרת הרצה">
            <button type="button" class="btn icon ghost" data-run="rewind" title="להתחלה (Home)" aria-label="להתחלה"><i data-icon="rewind"></i></button>
            <button type="button" class="btn icon ghost" data-run="prev" title="צעד אחורה (←)" aria-label="צעד אחורה"><i data-icon="prev"></i></button>
            <button type="button" class="btn icon primary play" data-run="play" title="הרצה (Enter במילה, P)" aria-label="הרצה"><i data-icon="play"></i></button>
            <button type="button" class="btn icon ghost" data-run="next" title="צעד קדימה (→)" aria-label="צעד קדימה"><i data-icon="next"></i></button>
            <button type="button" class="btn icon ghost" data-run="end" title="לסוף (End)" aria-label="לסוף"><i data-icon="end"></i></button>
          </div>
          <label class="speed" title="מהירות ההרצה">
            <span>מהירות</span>
            <input type="range" id="speed" min="1" max="5" step="1" value="3" aria-label="מהירות">
          </label>
        </div>
        <div class="run-info">
          <div class="status" id="run-status" role="status" aria-live="polite"></div>
          <div class="run-note" id="run-note"></div>
          <span class="step-count" id="step-count"></span>
        </div>
        <div class="machine-view" id="machine-view" dir="ltr"></div>
      </div>
      <div class="tests" aria-label="בדיקת מילים">
        <div class="tests-head">
          <h3>בדיקת מילים</h3>
          <span class="tests-summary" id="tests-summary"></span>
          <button type="button" class="btn secondary sm" data-cmd="run-tests"><i data-icon="beaker"></i><span>הרצת הכול</span></button>
        </div>
        <div class="tests-table-wrap">
          <table class="tests-table" id="tests-table">
            <thead><tr><th class="c-word">מילה</th><th class="c-exp">צפוי</th><th class="c-got">תוצאה</th><th class="c-act"><span class="sr">פעולות</span></th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <form class="tests-add" id="tests-add" autocomplete="off">
          <input type="text" dir="ltr" id="test-word" placeholder="מילה חדשה (ריק = ε)" spellcheck="false" aria-label="מילה חדשה לבדיקה">
          <button type="button" class="exp-toggle yes" id="test-exp" aria-pressed="true" title="מה המילה אמורה לעשות">מתקבלת</button>
          <button type="submit" class="btn icon secondary sm" aria-label="הוספה" title="הוספה (Enter)"><i data-icon="plus"></i></button>
        </form>
      </div>
    </section>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><h2 id="modal-title"></h2><button type="button" class="btn icon ghost" data-cmd="close-modal" aria-label="סגירה"><i data-icon="x"></i></button></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>
  <input type="file" id="file-input" accept=".json,application/json" hidden>

  <script src="js/icons.js"></script>
  <script src="js/model.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/examples.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/panels.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
