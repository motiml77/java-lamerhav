# DSViz — שרת ביניים ל"שליחת תרגיל" (Cloudflare Worker). הוראות התקנה: README.md
name = "dsviz-exercise"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# המודלים לפי הסדר: אם הראשון עמוס / נגמרה לו המכסה — עוברים לבא.
# gemini-flash-latest = תמיד גרסת ה-Flash החדשה ביותר (החזקה ביותר שיש לה מכסה חינמית גדולה);
# gemini-flash-lite-latest = קטן יותר, עם מכסה חינמית יומית גדולה יותר — גיבוי.
MODELS = "gemini-flash-latest,gemini-flash-lite-latest"

# כניסה למאגר התרגילים (מורים / עמדות / תלמידים / מסוף ההנהלה) — src/access/. ACCESS = "on": הכניסה פעילה; השליחה ל-Gemini נשארת פתוחה לכולם עד שמדליקים "רק למחוברים" במסוף ההנהלה.
# פרויקט Firebase נפרד (לא exams-a93fb). apiKey של Firebase לאתר הוא ציבורי (מופיע בכל דף) — לא סוד.
# הסודות (לא כאן!): FIREBASE_SERVICE_ACCOUNT (המפתח של חשבון השירות), PASS_KEY (tools/pass-key.mjs) — npx wrangler@4 secret put ...
ACCESS = "on"
FIREBASE_PROJECT_ID = "dsviz-access"
FIREBASE_API_KEY = "AIzaSyAv3WAay63CrsKiOFtplEsVFMMbAMHYDG8"
FIREBASE_AUTH_DOMAIN = "dsviz-access.firebaseapp.com"
ADMIN_EMAILS = "motiml77@gmail.com"

# הגבלת קצב לפי כתובת IP: עד 6 שליחות בדקה מכל מחשב (מגן על המכסה של Gemini מפני הצפה)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# מכסה יומית לכל כתובת IP (לא חובה): יוצרים KV בשם USAGE (npx wrangler kv namespace create USAGE),
# מעתיקים את ה-id שמתקבל לכאן ומורידים את ה-#:
# [[kv_namespaces]]
# binding = "USAGE"
# id = "<the id>"
# ואפשר לשנות את המכסה (ברירת מחדל 40 שליחות ביום לכל כתובת):
# DAILY_LIMIT = "40"   (שורה זו — בתוך [vars] למעלה)

# מונה הורדות (לא חובה): יוצרים KV בשם STATS (npx wrangler kv namespace create STATS),
# מעתיקים את ה-id שמתקבל לכאן ומורידים את ה-#. האתר מוריד דרך /dl/windows ו-/dl/zip ומציג את /v1/stats.
[[kv_namespaces]]
binding = "STATS"
id = "b9ac1d322427407dbcd5aba5b316b41e"
# הורדות מלפני שהמונה התחיל (לא חובה) — שורה בתוך [vars] למעלה:
# DOWNLOADS_BEFORE = "0"
#
# האתר (העלאת שאלת בגרות): הכתובות שמותר להן לשלוח מהדפדפן, מופרדות בפסיק (ברירת מחדל https://motiml77.github.io),
# ומכסה יומית לכל כתובת IP מהאתר (ברירת מחדל 8; נספרת רק אם USAGE מוגדר) — שורות בתוך [vars]:
# SITE_ORIGINS = "https://motiml77.github.io"
# SITE_DAILY_LIMIT = "8"
