<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>הדרכה לשימוש — DSViz</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body { height: 100%; margin: 0; }
body { background: #070913; color: #f2f4fb; font: 16px/1.4 "Segoe UI", Heebo, Arial, sans-serif; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; padding: 10px 16px; flex: 0 0 auto; }
.bar h1 { margin: 0; font-size: 20px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .donate { margin-right: 14px; }
.speed { direction: ltr; display: flex; align-items: center; }
.speed span { color: #aab2c8; font-size: 14px; direction: rtl; margin-right: 8px; }
.speed button { font: inherit; font-size: 14px; color: #f2f4fb; background: #1b2140; border: 1px solid #3a4468; border-radius: 10px; padding: 5px 12px; margin-left: 6px; min-width: 52px; cursor: pointer; }
.speed button:hover { background: #2a3260; }
.other { font: inherit; font-size: 14px; color: #f2f4fb; background: #1b2140; border: 1px solid #3a4468; border-radius: 10px; padding: 5px 12px; margin-right: 12px; cursor: pointer; display: none; }
.speed button.on { background: #5b8cff; border-color: #5b8cff; color: #fff; font-weight: 700; }
.stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 12px 12px; }
video { max-width: 100%; max-height: 100%; background: #000; border-radius: 10px; outline: none; }
#err { display: none; color: #ffd27a; text-align: center; padding: 20px; }
.foot { flex: 0 0 auto; padding: 0 16px 8px; }
.copy { color: #aab2c8; font-size: 11px; opacity: .7; direction: ltr; text-align: right; }
.donate { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 10px; white-space: nowrap; cursor: pointer; flex: none;
  font: 600 13.5px/1 "Segoe UI", Heebo, Arial, sans-serif; color: #e6e9f2; text-decoration: none;
  border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.04); transition: background-color .15s, border-color .15s, color .15s; }
.donate svg { width: 15px; height: 15px; margin-left: 8px; flex: none; color: #f472b6; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
.donate:hover { background: rgba(244,114,182,.12); border-color: rgba(244,114,182,.55); color: #fff; }
.donate:hover svg { fill: currentColor; }
.donate:focus-visible { outline: 2px solid #f472b6; outline-offset: 2px; }
.donate:active { background: rgba(244,114,182,.22); }
@media (max-width: 640px) { .donate span { display: none; } .donate { padding: 0 9px; } .donate svg { margin: 0; } }
</style></head><body>
<div class="bar"><h1 id="ttl"></h1><button class="other" id="other">הדרכה אחרת</button><div class="speed" id="speed"><span>מהירות</span></div><a class="donate" id="donate" href="https://www.paypal.com/donate/?business=motiml77%40gmail.com&currency_code=ILS&item_name=DSViz" target="_blank" rel="noopener" title="התוכנה חינמית — אם היא עוזרת לך, אפשר לתמוך בה ב-PayPal"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 14.2C4.4 11.4 1.5 8.9 1.5 5.6 1.5 3.5 3.1 2 5 2c1.3 0 2.4.7 3 1.8C8.6 2.7 9.7 2 11 2c1.9 0 3.5 1.5 3.5 3.6 0 3.3-2.9 5.8-6.5 8.6z"/></svg><span>תמכו בפרויקט</span></a></div>

<script>
var LIST = [{"id":"a","num":"01","title":"יצירת מבנה נתונים חדש","video":"a.mp4","poster":"a.jpg"},{"id":"b","num":"02","title":"דוגמאות פתורות","video":"b.mp4","poster":"b.jpg"},{"id":"c","num":"03","title":"מבנה בתוך מבנה","video":"c.mp4","poster":"c.jpg"},{"id":"d","num":"04","title":"מוסיפים התאמות לתרגיל","video":"d.mp4","poster":"d.jpg"},{"id":"e","num":"05","title":"שליחת תרגיל והצעה לפתרון","video":"e.mp4","poster":"e.jpg"}];
var SPEEDS = [1, 1.25, 1.5, 2];
function $(id) { return document.getElementById(id); }
var id = null || (location.hash || '#a').slice(1), t = LIST[0], i, vs = null;
try { vs = acquireVsCodeApi(); window.__dsvizVs = vs; } catch (e) { }
for (i = 0; i < LIST.length; i++) if (LIST[i].id === id) t = LIST[i];
$('ttl').textContent = t.num + ' · ' + t.title;
document.title = t.title;
var v = $('vid');
v.poster = t.poster;
var rate = 1;
try { rate = parseFloat(localStorage.getItem('dsviz.rate')) || 1; } catch (e) { }
if (SPEEDS.indexOf(rate) < 0) rate = 1;
function setRate(r) {
  rate = r; v.defaultPlaybackRate = r; v.playbackRate = r;
  try { localStorage.setItem('dsviz.rate', String(r)); } catch (e) { }
  var bs = $('speed').getElementsByTagName('button');
  for (var k = 0; k < bs.length; k++) bs[k].className = parseFloat(bs[k].getAttribute('data-r')) === r ? 'on' : '';
}
SPEEDS.forEach(function (r) {
  var b = document.createElement('button');
  b.setAttribute('data-r', r); b.textContent = r === 1 ? 'רגיל' : r + '×';
  b.onclick = function () { setRate(r); };
  $('speed').appendChild(b);
});
if (vs) { $('other').style.display = 'block'; $('other').onclick = function () { vs.postMessage({ cmd: 'list' }); }; }
function fail() {
  if (window.dsvizFail) { try { window.dsvizFail(); return; } catch (e) { } }
  if (vs) { vs.postMessage({ cmd: 'fail' }); }
  v.style.display = 'none'; $('err').style.display = 'block';
}
// הסרטון לא במחשב (ההתקנה בלי סרטונים, והעדכון ברקע עוד לא הוריד אותו) — מנגנים אותו מהאתר
var REMOTE = "https://raw.githubusercontent.com/motiml77/java-lamerhav/master/java-visualizer/help/vs/", triedRemote = false;
v.onerror = function () {
  if (REMOTE && !triedRemote) { triedRemote = true; v.src = REMOTE + t.id + '.mp4'; return; }
  fail();
};
v.addEventListener('loadedmetadata', function () { v.playbackRate = rate; });
v.src = t.video;
setRate(rate);
(function () {
  var d = document.getElementById('donate'); if (!d) return;
  d.onclick = function () {
    if (window.dsvizOpen) { try { window.dsvizOpen(d.href); return false; } catch (e) { } }
    if (window.__dsvizVs) { window.__dsvizVs.postMessage({ cmd: 'open', url: d.href }); return false; }
    return true;
  };
})();
</script></body></html>
